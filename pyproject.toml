[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-engineers-transcription-automator"
version = "0.2.0"
description = "Automates extraction, processing, and transcription of meeting recordings via GCP Speech-to-Text."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Marketing Engineers"},
]
dependencies = [
    "python-dotenv>=1.0.1",
    "google-cloud-speech>=2.0",
    "google-cloud-storage>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
transcribe = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
